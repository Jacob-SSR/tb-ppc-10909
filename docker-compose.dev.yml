# ใช้บนเครื่องนักพัฒนาเท่านั้น (ห้ามใช้บน .58 — เปิด port ของ mysql/redis)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d mysql redis
# แล้วตั้ง .env.local: TB_DB_HOST=127.0.0.1 TB_DB_PORT=3307 REDIS_URL=redis://127.0.0.1:6380 WORKER=0
# ใช้ 3307/6380 กันชนกับ MySQL/Redis ที่ติดตั้งบนเครื่องอยู่แล้ว (เช่น XAMPP ใช้ 3306)
services:
  mysql:
    ports: ["127.0.0.1:3307:3306"]
  redis:
    ports: ["127.0.0.1:6380:6379"]
