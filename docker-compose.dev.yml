# ใช้บนเครื่องนักพัฒนาเท่านั้น — เปิด port ของ redis ให้ npm run dev ต่อได้ (mysql เปิด 127.0.0.1:3313 อยู่แล้วใน docker-compose.yml)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d mysql redis
# แล้วตั้ง .env.local: TB_DB_HOST=127.0.0.1 TB_DB_PORT=3313 REDIS_URL=redis://127.0.0.1:6380 WORKER=0
# ใช้ 3313/6380 กันชนกับ MySQL/Redis ที่ติดตั้งบนเครื่องอยู่แล้ว (เช่น XAMPP ใช้ 3306)
services:
  redis:
    ports: ["127.0.0.1:6380:6379"]
