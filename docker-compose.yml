# tb-ppc — ระบบทะเบียนวัณโรค (stack แยกจาก ppc-hos บนเครื่อง 192.168.200.58)
# ชื่อ container / port / network / volume ขึ้นต้น tb-ppc ทั้งหมด ไม่ชนกับ ppc-hos (ppc-hos-dashboard, ppc-redis, :3000)
#
#   docker compose up -d --build          เริ่มระบบ
#   docker compose run --rm migrate       รัน migration (ครั้งแรก + ทุกครั้งที่มีไฟล์ใหม่)
#
# ⚠️ ห้าม `docker compose down -v` บน production — ลบ volume tb_mysql = ข้อมูลทะเบียนหายทั้งหมด

name: tb-ppc

services:
  app:
    build:
      context: .
      target: runner
    image: tb-ppc-app:latest
    container_name: tb-ppc-app
    restart: unless-stopped
    ports:
      - "3010:3000"
    env_file:
      - .env.production
    environment:
      - TB_DB_HOST=mysql
      - REDIS_URL=redis://redis:6379
      - TZ=Asia/Bangkok
      # worker ตรวจทุกเช้า 09:00: backup ล่าสุดเก่ากว่า 26 ชม. → แจ้ง LINE
      - BACKUP_CHECK_DIR=/backups
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.4
    container_name: tb-ppc-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    # MYSQL_ROOT_PASSWORD, TB_APP_PASSWORD, TB_MIGRATE_PASSWORD (ดู .env.mysql.example)
    env_file:
      - .env.mysql
    environment:
      - TZ=Asia/Bangkok
    volumes:
      - tb_mysql:/var/lib/mysql
      # สร้างบัญชี tb_app / tb_migrate ครั้งแรกเท่านั้น (ตอน volume ว่าง)
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/conf/client-utf8mb4.cnf:/etc/mysql/conf.d/client-utf8mb4.cnf:ro
    # ไม่เปิด ports: ออก LAN — แอปต่อผ่าน mysql:3306 ใน network ของ compose
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tb-ppc-redis
    restart: unless-stopped
    # ใช้แค่ rate limit / lock / cache — ข้อมูลหลักอยู่ใน MySQL จึงไม่ต้อง persist
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    mem_limit: 128m

  # backup ทุกคืน 01:00 → ${BACKUP_DIR} (ตั้งให้ชี้ NAS/แชร์ไดรฟ์นอกเครื่อง .58) เก็บ 30 วัน
  #   docker compose run --rm backup now      backup ทันที
  backup:
    image: mysql:8.4
    container_name: tb-ppc-backup
    restart: unless-stopped
    entrypoint: ["/backup.sh"]
    env_file:
      - .env.mysql
    environment:
      - TZ=Asia/Bangkok
      - BACKUP_HOUR=1
      - BACKUP_KEEP_DAYS=30
    volumes:
      - ./db/backup/backup.sh:/backup.sh:ro
      - ./db/conf/client-utf8mb4.cnf:/etc/mysql/conf.d/client-utf8mb4.cnf:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 256m

  # เปิดใช้นอก รพ. ผ่าน Cloudflare Tunnel (ทีหลัง): ใส่ TUNNEL_TOKEN ใน .env.tunnel แล้ว
  #   docker compose --profile tunnel up -d
  # ใน Cloudflare: Public hostname → http://app:3000, ตั้ง Access policy (≤ 50 คนฟรี)
  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    container_name: tb-ppc-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - .env.tunnel
    depends_on:
      - app

  # เครื่องมือ: รันเฉพาะตอนสั่ง ไม่ขึ้นพร้อม `up`
  #   docker compose run --rm migrate                                  สร้าง/อัปเดต schema (บัญชี tb_migrate)
  migrate:
    build:
      context: .
      target: tools
    image: tb-ppc-tools:latest
    profiles: ["tools"]
    env_file:
      - .env.mysql
    environment:
      - TB_DB_HOST=mysql
      - TB_MIGRATE_USER=tb_migrate
    depends_on:
      mysql:
        condition: service_healthy

  #   docker compose run --rm cli node scripts/create-admin.ts <user> "<ชื่อ>"   สร้างผู้ดูแลคนแรก
  #   docker compose run --rm cli node scripts/import-from-sheet.ts             ย้ายข้อมูลจาก Google Sheet
  cli:
    image: tb-ppc-tools:latest
    build:
      context: .
      target: tools
    profiles: ["tools"]
    env_file:
      - .env.production
    environment:
      - TB_DB_HOST=mysql
      - REDIS_URL=redis://redis:6379
      - TZ=Asia/Bangkok
    depends_on:
      mysql:
        condition: service_healthy

networks:
  default:
    name: tb-ppc-net

volumes:
  tb_mysql:
    name: tb_mysql
